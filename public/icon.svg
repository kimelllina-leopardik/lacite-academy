<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="128" fill="#0f172a"/>
  <circle cx="256" cy="256" r="220" stroke="url(#goldGrad)" stroke-width="8" opacity="0.6"/>
  <defs>
    <linearGradient id="goldGrad" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f59e0b"/>
      <stop offset="0.5" stop-color="#e11d48"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="160" y1="160" x2="352" y2="352" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <!-- Brand Monogram -->
  <text x="256" y="270" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="140" fill="url(#textGrad)" letter-spacing="4">G&amp;M</text>
  <text x="256" y="340" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="34" fill="#fbbf24" letter-spacing="12">ACADEMY</text>
  <!-- 3 Brand dots: lacite (amber/gold), geox (blue/steel), yves rocher (emerald) -->
  <circle cx="216" cy="384" r="10" fill="#f59e0b" />
  <circle cx="256" cy="384" r="10" fill="#38bdf8" />
  <circle cx="296" cy="384" r="10" fill="#10b981" />
</svg>
